<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found · Aditya Raj</title>
  <link rel="icon" href="/portfolio/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Poppins:wght@400;500&amp;display=swap" rel="stylesheet" />
  <style>
    :root { --ground:#f4f4ee; --ink:#121210; --soft:#3a3a33; --acid:#e6f43a; }
    * { margin:0; box-sizing:border-box; }
    body { min-height:100vh; display:grid; place-items:center; text-align:center; padding:24px; background:var(--ground); color:var(--ink); font:17px/1.6 Poppins, system-ui, sans-serif; }
    h1 { display:inline-block; font:400 clamp(4rem, 16vw, 9rem)/1 Bungee, "Arial Black", sans-serif; background:var(--acid); padding:.12em .4em; border-radius:28px; }
    p { margin-top:22px; color:var(--soft); }
    a { display:inline-flex; margin-top:28px; padding:12px 22px; border-radius:999px; background:var(--ink); color:var(--ground); text-decoration:none; font-weight:500; }
    a:focus-visible { outline:2px solid var(--ink); outline-offset:3px; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>This page doesn't exist. The portfolio is one click away.</p>
    <a href="/portfolio/">Back to the portfolio</a>

</html>
